<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MISSION CONTROL</title>
    <meta name="description" content="A calm personal assignment and task dashboard." />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mission Control" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <script>
      (() => {
        const defaults = { accent: "lavender", theme: "light", density: "comfortable", reduceMotion: false };
        try {
          const saved = JSON.parse(localStorage.getItem("mission-control.settings.v1") || "{}");
          const settings = { ...defaults, ...saved };
          document.documentElement.dataset.accent = settings.accent;
          document.documentElement.dataset.theme = settings.theme;
          document.documentElement.dataset.density = settings.density;
          document.documentElement.dataset.motion = settings.reduceMotion ? "reduced" : "full";
        } catch {
          document.documentElement.dataset.accent = defaults.accent;
          document.documentElement.dataset.theme = defaults.theme;
          document.documentElement.dataset.density = defaults.density;
          document.documentElement.dataset.motion = "full";
        }
      })();
    </script>
    <style>
      :root {
        --bg: #f7f7f5;
        --ink: #24252a;
        --muted: #73737c;
        --line: #e4e1da;
        --card: #ffffff;
        --soft: #efeeeb;
        --button-ink: #222326;
        --button-text: #ffffff;
        --accent: #6864d8;
        --accent-soft: #ecebff;
        --accent-ink: #5651bd;
        --must: #d95f4b;
        --should: #5f76d7;
        --side: #68a16a;
        --shadow: 0 18px 45px rgba(38, 37, 44, 0.08);
        --sheet-shadow: 0 18px 45px rgba(38, 37, 44, 0.08);
      }

      html[data-accent="blue"] {
        --accent: #3f73d8;
        --accent-soft: #e7efff;
        --accent-ink: #315bb3;
      }

      html[data-accent="pink"] {
        --accent: #d9679b;
        --accent-soft: #fde9f2;
        --accent-ink: #af4778;
      }

      html[data-accent="green"] {
        --accent: #5c9f72;
        --accent-soft: #e7f4ea;
        --accent-ink: #477d58;
      }

      html[data-accent="orange"] {
        --accent: #d07a42;
        --accent-soft: #f8eadf;
        --accent-ink: #a85f31;
      }

      html[data-accent="monochrome"] {
        --accent: #34353a;
        --accent-soft: #eeeeef;
        --accent-ink: #34353a;
      }

      html[data-theme="dark"] {
        --bg: #171718;
        --ink: #f1f0ed;
        --muted: #aaa8b1;
        --line: #36343b;
        --card: #222226;
        --soft: #2c2b30;
        --button-ink: #f1f0ed;
        --button-text: #171718;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.24);
        --sheet-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
      }

      @media (prefers-color-scheme: dark) {
        html[data-theme="system"] {
          --bg: #171718;
          --ink: #f1f0ed;
          --muted: #aaa8b1;
          --line: #36343b;
          --card: #222226;
          --soft: #2c2b30;
          --button-ink: #f1f0ed;
          --button-text: #171718;
          --shadow: 0 18px 45px rgba(0, 0, 0, 0.24);
          --sheet-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background: var(--bg);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 760px);
        gap: 28px;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
      }

      .sidebar {
        position: sticky;
        top: 28px;
        align-self: start;
        display: grid;
        gap: 26px;
        padding: 24px;
      }

      .profile {
        display: grid;
        width: 36px;
        height: 36px;
        margin-bottom: 16px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-size: 13px;
        font-weight: 850;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0;
      }

      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 15px;
      }

      .tabs,
      .filters,
      .choices {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tabs {
        flex-direction: column;
      }

      .tabs button,
      .filters button,
      .choices button {
        min-height: 40px;
        border: 0;
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        padding: 0 18px;
        font-weight: 760;
        transition:
          transform 160ms ease,
          background 160ms ease,
          color 160ms ease;
      }

      .tabs button {
        width: 100%;
        text-align: left;
      }

      .tabs button.active,
      .filters button.active,
      .choices button.active {
        background: var(--accent);
        color: #fff;
      }

      .tabs button:hover,
      .filters button:hover,
      .choices button:hover,
      .add-main:hover,
      .add-float:hover {
        transform: translateY(-1px);
      }

      .stats {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .board {
        width: min(100%, 760px);
        padding: 24px 0 108px;
      }

      .board-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin-bottom: 5px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 850;
        text-transform: uppercase;
      }

      h2 {
        font-size: 31px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .add-main,
      .submit {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: var(--button-ink);
        color: var(--button-text);
        padding: 0 18px;
        font-weight: 850;
        box-shadow: 0 12px 28px rgba(34, 35, 38, 0.14);
      }

      .add-main span {
        display: inline-block;
        margin-right: 7px;
        font-size: 20px;
        line-height: 0;
      }

      .settings-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--card);
        color: var(--muted);
        font-size: 20px;
        box-shadow: 0 8px 20px rgba(35, 34, 40, 0.04);
      }

      .filters { margin-bottom: 14px; }
      .search-row { display: flex; gap: 8px; margin-bottom: 24px; }
      .search-row input { flex: 1; min-width: 0; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
      .search-row button, .undo-bar button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
      .undo-bar { position: fixed; z-index: 20; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 8px 28px #0002; }
      .undo-bar span { flex: 1; min-width: 0; overflow-wrap: anywhere; max-height: 4.5em; overflow: auto; }
      .undo-bar button { flex-shrink: 0; }
      .date-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 12px; }
      .date-filters button { min-height: 40px; border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; }
      .date-filters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .filter-summary { margin: 0 0 22px; font-size: 14px; color: var(--muted); }
      .form-actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .form-actions > button { flex: 1 1 150px; }
      .add-another { min-height: 44px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font: inherit; font-weight: 700; }
      .save-feedback { color: var(--accent-ink); font-size: 14px; overflow-wrap: anywhere; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      .storage-error { padding: 12px; margin-bottom: 16px; border: 1px solid var(--must); border-radius: 8px; }
      body:has(.undo-bar:not([hidden])) .add-float { bottom: calc(145px + env(safe-area-inset-bottom)); }


      .list,
      .group {
        display: grid;
        gap: 14px;
      }

      .group {
        margin-bottom: 28px;
      }

      .group > h3 {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .card {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 86px;
        max-height: none;
        border: 1px solid var(--line);
        border-left-width: 5px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--card) 92%, transparent);
        padding: 16px;
        box-shadow: 0 8px 20px rgba(35, 34, 40, 0.04);
        transition:
          max-height 420ms ease,
          padding 420ms ease,
          opacity 260ms ease,
          transform 420ms ease,
          background 180ms ease;
      }

      .card.must {
        border-left-color: var(--must);
      }

      .card.should {
        border-left-color: var(--should);
      }

      .card.side {
        border-left-color: var(--side);
        background: color-mix(in srgb, var(--card) 78%, transparent);
      }

      .card.complete {
        opacity: 0.78;
      }

      .check {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 2px solid #d6d3ca;
        border-radius: 50%;
        background: var(--card);
        color: #fff;
        font-weight: 900;
        transition:
          background 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .complete .check,
      .completing .check {
        border-color: #a8d8a5;
        background: #74bd72;
        animation: complete-pop 240ms ease;
      }

      .card.completing {
        overflow: hidden;
        min-height: 0;
        max-height: 0;
        margin: -7px 0;
        padding-top: 0;
        padding-bottom: 0;
        opacity: 0;
        transform: translateY(-4px) scale(0.992);
        transition:
          max-height 420ms ease 180ms,
          margin 420ms ease 180ms,
          padding 420ms ease 180ms,
          opacity 260ms ease 140ms,
          transform 420ms ease;
      }

      .card.completing h4 {
        text-decoration: line-through;
        text-decoration-color: color-mix(in srgb, var(--accent) 60%, transparent);
      }

      .card.completing .actions {
        pointer-events: none;
        opacity: 0.45;
      }

      .main {
        min-width: 0;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mark {
        flex: 0 0 auto;
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 7px;
        background: var(--soft);
        color: #4e4d53;
        font-size: 12px;
        font-weight: 900;
      }

      .must .mark {
        background: #f5dfdb;
        color: #a94131;
      }

      .should .mark {
        background: #e4e8ff;
        color: #455bbb;
      }

      .side .mark {
        background: #e4f0e3;
        color: #4e7c50;
      }

      .card h4 {
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--ink);
        font-size: 17px;
        font-weight: 760;
        line-height: 1.25;
      }

      .card p {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      .card p span + span::before {
        content: "-";
        margin-right: 8px;
        color: #b3afa6;
      }

      .actions {
        display: flex;
        gap: 6px;
      }

      .actions button,
      .panel-head button {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        padding: 0 11px;
        font-size: 13px;
        font-weight: 720;
      }

      .empty {
        display: grid;
        justify-items: center;
        gap: 9px;
        border: 1px dashed #d9d5cc;
        border-radius: 8px;
        background: color-mix(in srgb, var(--card) 68%, transparent);
        padding: 46px 22px;
        text-align: center;
      }

      .empty-badge {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 22px;
        font-weight: 900;
      }

      .empty h3 {
        font-size: 20px;
      }

      .empty p {
        max-width: 390px;
        color: var(--muted);
        line-height: 1.55;
      }

      .add-float {
        position: fixed;
        right: 26px;
        bottom: calc(26px + env(safe-area-inset-bottom));
        display: none;
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 32px;
        line-height: 1;
        box-shadow: var(--shadow);
      }

      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: end center;
        background: rgba(34, 35, 38, 0.24);
        padding: calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
      }

      .panel {
        width: min(100%, 520px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 22px;
        box-shadow: var(--sheet-shadow);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .panel-head h3 {
        font-size: 23px;
      }

      .panel-head button {
        width: 38px;
        padding: 0;
        font-size: 22px;
      }

      .field {
        display: grid;
        gap: 9px;
        margin-bottom: 18px;
      }

      .field > span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
        text-transform: uppercase;
      }

      .field input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--card) 78%, var(--soft));
        color: var(--ink);
        padding: 0 14px;
        outline: none;
      }

      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .deadline-choices {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .choices button {
        width: 100%;
        min-width: 0;
        padding: 0 10px;
        white-space: normal;
      }

      .date-input {
        margin-top: 10px;
      }

      .submit {
        width: 100%;
      }

      .settings-panel {
        width: min(100%, 560px);
      }

      .settings-section {
        display: grid;
        gap: 14px;
      }

      .settings-section + .settings-section {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .settings-section h4 {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
        text-transform: uppercase;
      }

      .setting-row {
        display: grid;
        gap: 9px;
      }

      .setting-row > span {
        font-size: 15px;
        font-weight: 760;
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }

      .swatch {
        display: grid;
        min-height: 58px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }

      .swatch::before {
        content: "";
        display: block;
        width: 18px;
        height: 18px;
        margin-bottom: 4px;
        border-radius: 50%;
        background: var(--swatch-color);
      }

      .swatch.active {
        border-color: var(--accent);
        color: var(--ink);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .segmented.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .segmented button {
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        padding: 0 12px;
        font-weight: 760;
      }

      .segmented button.active {
        background: var(--accent);
        color: #fff;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 48px;
      }

      .switch {
        position: relative;
        width: 52px;
        height: 30px;
        border: 0;
        border-radius: 999px;
        background: var(--soft);
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--card);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
        transition: transform 180ms ease;
      }

      .switch.active {
        background: var(--accent);
      }

      .switch.active::after {
        transform: translateX(22px);
      }

      html[data-density="compact"] .shell {
        gap: 20px;
      }

      html[data-density="compact"] .sidebar {
        gap: 20px;
      }

      html[data-density="compact"] .board {
        padding-top: 18px;
      }

      html[data-density="compact"] .filters {
        margin-bottom: 18px;
      }

      html[data-density="compact"] .group {
        gap: 10px;
        margin-bottom: 20px;
      }

      html[data-density="compact"] .card {
        min-height: 72px;
        padding: 12px 14px;
      }

      html[data-theme="dark"] .backdrop {
        background: rgba(0, 0, 0, 0.42);
      }

      @media (prefers-color-scheme: dark) {
        html[data-theme="system"] .backdrop {
          background: rgba(0, 0, 0, 0.42);
        }
      }

      [hidden] {
        display: none !important;
      }

      @keyframes complete-pop {
        0% {
          transform: scale(0.82);
        }
        70% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (max-width: 860px) {
        .shell {
          display: block;
          padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
        }

        .sidebar {
          position: relative;
          top: auto;
          gap: 18px;
          padding: 8px 0 20px;
        }

        .sidebar .settings-button {
          position: absolute;
          top: 4px;
          right: 0;
        }

        .tabs {
          flex-direction: row;
        }

        .tabs button {
          flex: 1 1 0;
          text-align: center;
          white-space: nowrap;
          padding: 0 10px;
        }

        .stats {
          display: none;
        }

        .board {
          width: 100%;
          padding-top: 2px;
        }
      }

      @media (max-width: 620px) {
        h1 {
          font-size: 25px;
        }

        h2 {
          font-size: 25px;
        }

        .board-top {
          align-items: flex-start;
        }

        .add-main {
          display: none;
        }

        .add-float {
          display: grid;
          place-items: center;
        }

        .filters {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .filters button {
          width: 100%;
          padding: 0 10px;
        }

        .card {
          grid-template-columns: 34px minmax(0, 1fr);
        }

        .actions {
          grid-column: 2;
          justify-content: flex-start;
        }

        .backdrop {
          align-items: end;
          padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
        }

        .panel {
          max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
          overflow: auto;
          -webkit-overflow-scrolling: touch;
        }

        .choices,
        .deadline-choices {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .swatches {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .settings-panel {
          max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
          overflow: auto;
          -webkit-overflow-scrolling: touch;
        }
      }

      html[data-motion="reduced"] *,
      html[data-motion="reduced"] *::before,
      html[data-motion="reduced"] *::after {
        animation-duration: 0.01ms !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="Mission navigation">
        <div>
          <div class="profile">SX</div>
          <h1>MISSION CONTROL</h1>
          <p class="status" id="statusText">Loading missions</p>
        </div>

        <nav class="tabs" aria-label="Task views">
          <button class="active" data-view="todo" type="button">TO DO</button>
          <button data-view="done" type="button">DONE</button>
          <button data-view="all" type="button">ALL</button>
        </nav>

        <div class="stats">
          <span id="openCount">0 open</span>
          <span id="weekCount">0 done this week</span>
        </div>

        <button class="settings-button" id="settingsOpen" type="button" aria-label="Open settings" title="Settings">
          ⚙
        </button>
      </aside>

      <section class="board">
        <header class="board-top">
          <div>
            <p class="eyebrow">Personal assignment dashboard</p>
            <h2 id="boardTitle">Current missions</h2>
          </div>
          <button class="add-main" id="addMain" type="button"><span aria-hidden="true">+</span>Add Task</button>
        </header>

        <div class="filters" aria-label="Level filter">
          <button class="active" data-level="all" type="button">All</button>
          <button data-level="must" type="button">MUST</button>
          <button data-level="should" type="button">SHOULD</button>
          <button data-level="side" type="button">SIDE QUEST</button>
        </div>

        <div class="search-row">
          <input id="searchInput" type="search" aria-label="Search tasks" placeholder="Search tasks…" />
          <button id="clearSearch" type="button" hidden>Clear</button>
        </div>
        <div class="date-filters" aria-label="Deadline filter">
          <button class="active" data-date-filter="all" type="button" aria-pressed="true">All dates</button>
          <button data-date-filter="overdue" type="button" aria-pressed="false">Overdue</button>
          <button data-date-filter="today" type="button" aria-pressed="false">Today</button>
          <button data-date-filter="week" type="button" aria-pressed="false" title="Today and the next six days">Next 7 days</button>
          <button data-date-filter="none" type="button" aria-pressed="false">No deadline</button>
        </div>
        <p class="filter-summary" id="filterSummary" role="status" aria-live="polite"></p>
        <p class="storage-error" id="storageError" role="alert" hidden></p>
        <div class="list" id="taskList"></div>
      </section>

      <button class="add-float" id="addFloat" type="button" aria-label="Add task">+</button>

      <div class="backdrop" id="modal" role="presentation" hidden>
        <form class="panel" id="taskForm">
          <div class="panel-head">
            <h3 id="panelTitle">Add Task</h3>
            <button id="closePanel" aria-label="Close panel" type="button">x</button>
          </div>

          <label class="field">
            <span>Task name</span>
            <input id="titleInput" maxlength="120" placeholder="Physics quiz" required />
          </label>

          <div class="field">
            <span>Level</span>
            <div class="choices" id="levelChoices">
              <button class="active" data-draft-level="must" type="button">MUST</button>
              <button data-draft-level="should" type="button">SHOULD</button>
              <button data-draft-level="side" type="button">SIDE QUEST</button>
            </div>
          </div>

          <div class="field">
            <span>Deadline</span>
            <div class="choices deadline-choices" id="deadlineChoices">
              <button data-deadline-mode="today" type="button">Today</button>
              <button class="active" data-deadline-mode="tomorrow" type="button">Tomorrow</button>
              <button data-deadline-mode="pick" type="button">Pick Date</button>
              <button data-deadline-mode="none" type="button">No Deadline</button>
            </div>
            <input class="date-input" id="dateInput" type="date" hidden />
          </div>

          <p class="save-feedback" id="saveFeedback" role="status" aria-live="polite" hidden></p>
          <div class="form-actions">
            <button class="submit" id="submitButton" type="submit">Add Task</button>
            <button class="add-another" id="addAnother" type="submit">Add & keep open</button>
          </div>
        </form>
      </div>

      <div class="backdrop" id="settingsModal" role="presentation" hidden>
        <section class="panel settings-panel" aria-labelledby="settingsTitle">
          <div class="panel-head">
            <h3 id="settingsTitle">Settings</h3>
            <button id="settingsClose" aria-label="Close settings" type="button">x</button>
          </div>

          <div class="settings-section">
            <h4>Appearance</h4>
            <div class="setting-row">
              <span>Accent Color</span>
              <div class="swatches" id="accentChoices">
                <button class="swatch" style="--swatch-color: #6864d8" data-setting-accent="lavender" type="button">Lavender</button>
                <button class="swatch" style="--swatch-color: #3f73d8" data-setting-accent="blue" type="button">Blue</button>
                <button class="swatch" style="--swatch-color: #d9679b" data-setting-accent="pink" type="button">Pink</button>
                <button class="swatch" style="--swatch-color: #5c9f72" data-setting-accent="green" type="button">Green</button>
                <button class="swatch" style="--swatch-color: #d07a42" data-setting-accent="orange" type="button">Orange</button>
                <button class="swatch" style="--swatch-color: #34353a" data-setting-accent="monochrome" type="button">Mono</button>
              </div>
            </div>

            <div class="setting-row">
              <span>Theme</span>
              <div class="segmented" id="themeChoices">
                <button data-setting-theme="light" type="button">Light</button>
                <button data-setting-theme="dark" type="button">Dark</button>
                <button data-setting-theme="system" type="button">System</button>
              </div>
            </div>

            <div class="setting-row">
              <span>Density</span>
              <div class="segmented two" id="densityChoices">
                <button data-setting-density="comfortable" type="button">Comfortable</button>
                <button data-setting-density="compact" type="button">Compact</button>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <div class="toggle-row">
              <div>
                <h4>Reduce animations</h4>
                <p class="status">Shorten completion motion and transitions.</p>
              </div>
              <button class="switch" id="motionSwitch" type="button" role="switch" aria-checked="false"></button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="undo-bar" id="undoBar" hidden>
      <span id="undoMessage" role="status" aria-live="polite"></span>
      <button id="undoButton" type="button">Undo</button>
      <button id="dismissUndo" type="button" aria-label="Dismiss undo">×</button>
    </div>
    <script>
      const STORAGE_KEY = "mission-control.tasks.v1";
      const INIT_KEY = "mission-control.initialized.v1";
      const SETTINGS_KEY = "mission-control.settings.v1";
      const defaultSettings = {
        accent: "lavender",
        theme: "light",
        density: "comfortable",
        reduceMotion: false,
      };
      const levelMeta = {
        must: { label: "MUST", mark: "M" },
        should: { label: "SHOULD", mark: "S" },
        side: { label: "SIDE QUEST", mark: "Q" },
      };

      const state = {
        tasks: [],
        view: "todo",
        levelFilter: "all",
        deadlineFilter: "all",
        search: "",
        undoStack: [],
        storageBlocked: false,
        editingId: null,
        completingIds: new Set(),
        completeTimers: new Map(),
        settings: { ...defaultSettings },
        draft: {
          title: "",
          level: "must",
          deadlineMode: "tomorrow",
          pickedDate: "",
        },
      };

      const els = {
        status: document.querySelector("#statusText"),
        openCount: document.querySelector("#openCount"),
        weekCount: document.querySelector("#weekCount"),
        boardTitle: document.querySelector("#boardTitle"),
        list: document.querySelector("#taskList"),
        modal: document.querySelector("#modal"),
        form: document.querySelector("#taskForm"),
        panelTitle: document.querySelector("#panelTitle"),
        submitButton: document.querySelector("#submitButton"),
        titleInput: document.querySelector("#titleInput"),
        dateInput: document.querySelector("#dateInput"),
        settingsModal: document.querySelector("#settingsModal"),
        motionSwitch: document.querySelector("#motionSwitch"),
      };

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
          return {
            ...defaultSettings,
            ...saved,
            accent: ["lavender", "blue", "pink", "green", "orange", "monochrome"].includes(saved.accent)
              ? saved.accent
              : defaultSettings.accent,
            theme: ["light", "dark", "system"].includes(saved.theme) ? saved.theme : defaultSettings.theme,
            density: ["comfortable", "compact"].includes(saved.density) ? saved.density : defaultSettings.density,
            reduceMotion: Boolean(saved.reduceMotion),
          };
        } catch {
          localStorage.removeItem(SETTINGS_KEY);
          return { ...defaultSettings };
        }
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
      }

      function applySettings() {
        document.documentElement.dataset.accent = state.settings.accent;
        document.documentElement.dataset.theme = state.settings.theme;
        document.documentElement.dataset.density = state.settings.density;
        document.documentElement.dataset.motion = state.settings.reduceMotion ? "reduced" : "full";

        document.querySelectorAll("[data-setting-accent]").forEach((button) => {
          button.classList.toggle("active", button.dataset.settingAccent === state.settings.accent);
        });
        document.querySelectorAll("[data-setting-theme]").forEach((button) => {
          button.classList.toggle("active", button.dataset.settingTheme === state.settings.theme);
        });
        document.querySelectorAll("[data-setting-density]").forEach((button) => {
          button.classList.toggle("active", button.dataset.settingDensity === state.settings.density);
        });
        els.motionSwitch.classList.toggle("active", state.settings.reduceMotion);
        els.motionSwitch.setAttribute("aria-checked", String(state.settings.reduceMotion));
      }

      function setSetting(key, value) {
        state.settings[key] = value;
        saveSettings();
        applySettings();
      }

      function prefersReducedMotion() {
        return (
          state.settings.reduceMotion ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
      }

      function isoToday(offset = 0) {
        const date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setDate(date.getDate() + offset);
        return localDate(date);
      }

      function localDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function newTaskId() {
        if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
        return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
      }

      function createDemoTasks() {
        const now = new Date().toISOString();
        return [
          ["Economics HW", "must", "2026-08-31"],
          ["Enrichment component choosing", "should", "2026-08-31"],
          ["CS notes cleanup", "side", null],
          ["Drama vocab review", "side", null],
          ["Never Enough song practice", "side", null],
          ["Drama monologue - research / memorize", "side", null],
        ].map(([title, level, deadline], index) => ({
          id: `demo-${index + 1}`,
          title,
          level,
          deadline,
          completed: false,
          createdAt: now,
          completedAt: null,
        }));
      }

      function isTask(task) {
        return (
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          ["must", "should", "side"].includes(task.level) &&
          (typeof task.deadline === "string" || task.deadline === null) &&
          typeof task.completed === "boolean" &&
          typeof task.createdAt === "string" &&
          (typeof task.completedAt === "string" || task.completedAt === null)
        );
      }

      function storageError(message) {
        const error = document.querySelector("#storageError");
        error.textContent = message;
        error.hidden = false;
      }

      function loadTasks() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored !== null) {
            const parsed = JSON.parse(stored);
            if (!Array.isArray(parsed) || !parsed.every(isTask)) throw new Error("Invalid task data");
            return parsed;
          }
          if (localStorage.getItem(INIT_KEY)) return [];
          const demo = createDemoTasks();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(demo));
          localStorage.setItem(INIT_KEY, "true");
          return demo;
        } catch {
          state.storageBlocked = true;
          storageError("Saved tasks could not be read. Your stored data has been kept unchanged. Editing is paused; reload after recovering the data or enabling browser storage.");
          return [];
        }
      }

      function saveTasks(tasks = state.tasks) {
        if (state.storageBlocked) return false;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {
          storageError("Could not save. Nothing was changed. Free browser storage and try again.");
          return false;
        }
        state.tasks = tasks;
        document.querySelector("#storageError").hidden = true;
        return true;
      }

      function rememberAction(kind, task, index) {
        state.undoStack.push({ kind, task: { ...task }, index });
        if (state.undoStack.length > 20) state.undoStack.shift();
        renderUndo();
      }

      function renderUndo() {
        const action = state.undoStack.at(-1);
        document.querySelector("#undoBar").hidden = !action;
        document.querySelector("#undoMessage").textContent = action ? `${action.kind}: ${action.task.title}` : "";
      }

      function undoLastAction() {
        const action = state.undoStack.at(-1);
        if (!action) return;
        const tasks = state.tasks.slice();
        const index = tasks.findIndex(task => task.id === action.task.id);
        if (action.kind === "Deleted") {
          if (index !== -1) return;
          tasks.splice(Math.min(action.index, tasks.length), 0, action.task);
        } else {
          if (index === -1) return;
          tasks[index] = { ...tasks[index], completed: action.task.completed, completedAt: action.task.completedAt };
        }
        if (!saveTasks(tasks)) return;
        window.clearTimeout(state.completeTimers.get(action.task.id));
        state.completeTimers.delete(action.task.id);
        state.completingIds.delete(action.task.id);
        state.undoStack.pop();
        renderUndo();
        render();
      }

      function deadlineValue(task) {
        return task.deadline ? new Date(`${task.deadline}T12:00:00`).getTime() : Number.MAX_SAFE_INTEGER;
      }

      function compareTodo(a, b) {
        const deadlineDiff = deadlineValue(a) - deadlineValue(b);
        if (deadlineDiff !== 0) return deadlineDiff;
        const weight = { must: 0, should: 1, side: 2 };
        return weight[a.level] - weight[b.level] || a.createdAt.localeCompare(b.createdAt);
      }

      function compareDone(a, b) {
        return (b.completedAt || "").localeCompare(a.completedAt || "");
      }

      function formatDateLabel(iso) {
        if (!iso) return "No deadline";
        const today = isoToday();
        const tomorrow = isoToday(1);
        if (iso === today) return "Today";
        if (iso === tomorrow) return "Tomorrow";
        return new Intl.DateTimeFormat("en", {
          weekday: "short",
          day: "numeric",
          month: "short",
        }).format(new Date(`${iso}T12:00:00`));
      }

      function formatShortDate(iso) {
        return new Intl.DateTimeFormat("en", { day: "numeric", month: "short" }).format(
          new Date(`${iso}T12:00:00`),
        );
      }

      function sectionLabel(task) {
        if (state.view === "done") {
          return task.completedAt ? formatDateLabel(localDate(new Date(task.completedAt))).toUpperCase() : "COMPLETED";
        }
        if (!task.deadline) return "NO DEADLINE";
        const today = isoToday();
        const tomorrow = isoToday(1);
        if (task.deadline < today) return "OVERDUE";
        if (task.deadline === today) return `TODAY - ${formatShortDate(task.deadline)}`;
        if (task.deadline === tomorrow) return `TOMORROW - ${formatShortDate(task.deadline)}`;
        return formatDateLabel(task.deadline).toUpperCase();
      }

      function matchesDeadline(task) {
        const date = task.deadline;
        if (state.deadlineFilter === "overdue") return !!date && date < isoToday();
        if (state.deadlineFilter === "today") return date === isoToday();
        if (state.deadlineFilter === "week") return !!date && date >= isoToday() && date <= isoToday(6);
        if (state.deadlineFilter === "none") return !date;
        return true;
      }

      function getFilteredTasks() {
        return state.tasks
          .filter((task) => {
            if (state.view === "todo" && task.completed && !state.completingIds.has(task.id)) return false;
            if (state.view === "done" && (!task.completed || state.completingIds.has(task.id))) return false;
            if (state.levelFilter !== "all" && task.level !== state.levelFilter) return false;
            if (state.search && !task.title.toLocaleLowerCase().includes(state.search)) return false;
            if (!matchesDeadline(task)) return false;
            return true;
          })
          .sort((a, b) => (state.view === "done" ? compareDone(a, b) : compareTodo(a, b)));
      }

      function groupTasks(tasks) {
        const groups = new Map();
        tasks.forEach((task) => {
          const label = sectionLabel(task);
          groups.set(label, [...(groups.get(label) || []), task]);
        });
        return Array.from(groups.entries());
      }

      function updateStatus() {
        const open = state.tasks.filter((task) => !task.completed);
        const mustOpen = open.filter((task) => task.level === "must").length;
        const dueToday = open.filter((task) => task.deadline === isoToday()).length;
        const dueTomorrow = open.filter((task) => task.deadline === isoToday(1)).length;
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        const doneWeek = state.tasks.filter((task) => task.completedAt && new Date(task.completedAt) >= weekAgo).length;

        els.status.textContent =
          mustOpen === 0
            ? "Must-do cleared"
            : [`${mustOpen} must-do`, dueToday ? `${dueToday} due today` : "", dueTomorrow ? `${dueTomorrow} due tomorrow` : ""]
                .filter(Boolean)
                .join(" - ");
        els.openCount.textContent = `${open.length} open`;
        els.weekCount.textContent = `${doneWeek} done this week`;
      }

      function makeButton(text, className, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        if (className) button.className = className;
        button.addEventListener("click", onClick);
        return button;
      }

      function renderTask(task) {
        const isCompleting = state.completingIds.has(task.id);
        const card = document.createElement("article");
        card.className = `card ${task.level}${task.completed || isCompleting ? " complete" : ""}${isCompleting ? " completing" : ""}`;
        card.dataset.taskId = task.id;

        const check = makeButton(task.completed || isCompleting ? "✓" : "", "check", () => toggleTask(task.id));
        check.setAttribute("aria-label", task.completed ? "Restore task" : "Complete task");
        check.disabled = isCompleting;
        card.append(check);

        const main = document.createElement("div");
        main.className = "main";

        const titleRow = document.createElement("div");
        titleRow.className = "title-row";
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.textContent = levelMeta[task.level].mark;
        const title = document.createElement("h4");
        title.textContent = task.title;
        titleRow.append(mark, title);

        const meta = document.createElement("p");
        [levelMeta[task.level].label, formatDateLabel(task.deadline), task.completedAt ? `Done ${formatDateLabel(localDate(new Date(task.completedAt)))}` : ""]
          .filter(Boolean)
          .forEach((item) => {
            const span = document.createElement("span");
            span.textContent = item;
            meta.append(span);
          });

        main.append(titleRow, meta);
        card.append(main);

        const actions = document.createElement("div");
        actions.className = "actions";
        const editButton = makeButton("Edit", "", () => openPanel(task.id));
        const deleteButton = makeButton("Delete", "", () => deleteTask(task.id));
        editButton.disabled = isCompleting;
        deleteButton.disabled = isCompleting;
        actions.append(editButton, deleteButton);
        card.append(actions);
        return card;
      }

      function renderEmpty() {
        const empty = document.createElement("div");
        empty.className = "empty";
        const badge = document.createElement("span");
        badge.className = "empty-badge";
        badge.textContent = state.view === "done" ? "✓" : ".";
        const title = document.createElement("h3");
        title.textContent = state.view === "done" ? "No completed missions yet" : "Clear skies here";
        const copy = document.createElement("p");
        copy.textContent =
          state.view === "done"
            ? "Finished assignments will collect here with their original level and deadline."
            : "Add a mission when something needs your attention, or switch filters to see more.";
        empty.append(badge, title, copy);
        return empty;
      }

      function render() {
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === state.view);
        });
        document.querySelectorAll("[data-level]").forEach((button) => {
          button.classList.toggle("active", button.dataset.level === state.levelFilter);
        });
        els.boardTitle.textContent =
          state.view === "done" ? "Completed history" : state.view === "all" ? "All missions" : "Current missions";

        updateStatus();
        document.querySelectorAll("[data-date-filter]").forEach(button => {
          const active = button.dataset.dateFilter === state.deadlineFilter;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        els.list.replaceChildren();
        const filtered = getFilteredTasks();
        document.querySelector("#filterSummary").textContent = `${filtered.length} ${filtered.length === 1 ? "task" : "tasks"} shown`;
        const groups = groupTasks(filtered);
        if (!groups.length) {
          els.list.append(renderEmpty());
          return;
        }
        groups.forEach(([label, tasks]) => {
          const group = document.createElement("section");
          group.className = "group";
          const heading = document.createElement("h3");
          heading.textContent = label;
          group.append(heading, ...tasks.map(renderTask));
          els.list.append(group);
        });
      }

      function syncDraftControls() {
        els.titleInput.value = state.draft.title;
        els.dateInput.value = state.draft.pickedDate;
        els.dateInput.hidden = state.draft.deadlineMode !== "pick";
        document.querySelectorAll("[data-draft-level]").forEach((button) => {
          button.classList.toggle("active", button.dataset.draftLevel === state.draft.level);
        });
        document.querySelectorAll("[data-deadline-mode]").forEach((button) => {
          button.classList.toggle("active", button.dataset.deadlineMode === state.draft.deadlineMode);
        });
      }

      function openPanel(taskId = null) {
        if (state.storageBlocked || (taskId && state.completingIds.has(taskId))) return;
        const task = taskId ? state.tasks.find((item) => item.id === taskId) : null;
        state.editingId = taskId;
        state.draft = task
          ? {
              title: task.title,
              level: task.level,
              deadlineMode: task.deadline ? "pick" : "none",
              pickedDate: task.deadline || "",
            }
          : {
              title: "",
              level: "must",
              deadlineMode: "tomorrow",
              pickedDate: isoToday(1),
            };

        els.panelTitle.textContent = task ? "Edit Task" : "Add Task";
        els.submitButton.textContent = task ? "Save Changes" : "Add Task";
        document.querySelector("#addAnother").hidden = !!task;
        document.querySelector("#saveFeedback").hidden = true;
        syncDraftControls();
        els.modal.hidden = false;
        requestAnimationFrame(() => els.titleInput.focus());
      }

      function closePanel() {
        els.modal.hidden = true;
        state.editingId = null;
      }

      function draftToDeadline() {
        if (state.draft.deadlineMode === "today") return isoToday();
        if (state.draft.deadlineMode === "tomorrow") return isoToday(1);
        if (state.draft.deadlineMode === "pick") return state.draft.pickedDate || null;
        return null;
      }

      function saveTask(event) {
        event.preventDefault();
        if (els.modal.hidden || state.storageBlocked) return;
        const title = els.titleInput.value.trim();
        if (!title) return;
        const deadline = draftToDeadline();
        let tasks;

        if (state.editingId) {
          tasks = state.tasks.map((task) =>
            task.id === state.editingId
              ? {
                  ...task,
                  title,
                  level: state.draft.level,
                  deadline,
                }
              : task,
          );
        } else {
          tasks = [...state.tasks, {
            id: newTaskId(),
            title,
            level: state.draft.level,
            deadline,
            completed: false,
            createdAt: new Date().toISOString(),
            completedAt: null,
          }];
        }

        if (!saveTasks(tasks)) return;
        const keepOpen = !state.editingId && event.submitter?.id === "addAnother";
        if (keepOpen) {
          state.draft.title = "";
          syncDraftControls();
          const feedback = document.querySelector("#saveFeedback");
          feedback.textContent = `Added “${title}”. Ready for the next task.`;
          feedback.hidden = false;
          els.titleInput.focus();
        } else closePanel();
        render();
      }

      function toggleTask(id) {
        const task = state.tasks.find(item => item.id === id);
        if (!task || state.storageBlocked || state.completingIds.has(id)) return;
        const tasks = state.tasks.map(item => item.id === id ? {
          ...item, completed: !item.completed,
          completedAt: item.completed ? null : new Date().toISOString(),
        } : item);
        // Persist the user's intent before starting cosmetic motion.
        if (!saveTasks(tasks)) return;
        rememberAction(task.completed ? "Restored" : "Completed", task);
        if (task.completed) render();
        else startCompletion(id);
      }

      function startCompletion(id) {
        if (state.completingIds.has(id)) return;

        if (prefersReducedMotion()) {
          finishCompletion(id);
          return;
        }

        state.completingIds.add(id);
        const card = document.querySelector(`[data-task-id="${CSS.escape(id)}"]`);
        if (card) {
          card.style.maxHeight = `${card.getBoundingClientRect().height}px`;
          card.classList.add("complete");
          card.querySelector(".check").textContent = "✓";
          card.querySelectorAll("button").forEach((button) => {
            button.disabled = true;
          });
          requestAnimationFrame(() => { card.style.maxHeight = "0px"; card.classList.add("completing"); });
        } else {
          render();
        }
        const timer = window.setTimeout(() => finishCompletion(id), 680);
        state.completeTimers.set(id, timer);
      }

      function finishCompletion(id) {
        const timer = state.completeTimers.get(id);
        if (timer) window.clearTimeout(timer);
        state.completeTimers.delete(id);
        state.completingIds.delete(id);
        render();
      }

      function deleteTask(id) {
        if (state.completingIds.has(id)) return;
        const task = state.tasks.find((item) => item.id === id);
        if (!task || !confirm(`Delete "${task.title}"?`)) return;
        const index = state.tasks.indexOf(task);
        if (!saveTasks(state.tasks.filter((item) => item.id !== id))) return;
        rememberAction("Deleted", task, index);
        render();
      }

      function openSettings() {
        applySettings();
        els.settingsModal.hidden = false;
      }

      function closeSettings() {
        els.settingsModal.hidden = true;
      }

      document.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", () => {
          state.view = button.dataset.view;
          render();
        });
      });

      document.querySelectorAll("[data-level]").forEach((button) => {
        button.addEventListener("click", () => {
          state.levelFilter = button.dataset.level;
          render();
        });
      });

      document.querySelector("#addMain").addEventListener("click", () => openPanel());
      document.querySelector("#addFloat").addEventListener("click", () => openPanel());
      document.querySelector("#settingsOpen").addEventListener("click", openSettings);
      document.querySelector("#settingsClose").addEventListener("click", closeSettings);
      els.settingsModal.addEventListener("mousedown", (event) => {
        if (event.target === els.settingsModal) closeSettings();
      });
      document.querySelector("#closePanel").addEventListener("click", closePanel);
      els.modal.addEventListener("mousedown", (event) => {
        if (event.target === els.modal) closePanel();
      });
      els.form.addEventListener("submit", saveTask);
      els.titleInput.addEventListener("input", (event) => {
        state.draft.title = event.target.value;
      });
      els.dateInput.addEventListener("input", (event) => {
        state.draft.pickedDate = event.target.value;
      });

      document.querySelectorAll("[data-draft-level]").forEach((button) => {
        button.addEventListener("click", () => {
          state.draft.level = button.dataset.draftLevel;
          syncDraftControls();
        });
      });

      document.querySelectorAll("[data-deadline-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          state.draft.deadlineMode = button.dataset.deadlineMode;
          if (state.draft.deadlineMode === "today") state.draft.pickedDate = isoToday();
          if (state.draft.deadlineMode === "tomorrow") state.draft.pickedDate = isoToday(1);
          syncDraftControls();
        });
      });

      document.querySelectorAll("[data-setting-accent]").forEach((button) => {
        button.addEventListener("click", () => setSetting("accent", button.dataset.settingAccent));
      });

      document.querySelectorAll("[data-setting-theme]").forEach((button) => {
        button.addEventListener("click", () => setSetting("theme", button.dataset.settingTheme));
      });

      document.querySelectorAll("[data-setting-density]").forEach((button) => {
        button.addEventListener("click", () => setSetting("density", button.dataset.settingDensity));
      });

      els.motionSwitch.addEventListener("click", () => setSetting("reduceMotion", !state.settings.reduceMotion));

      document.querySelectorAll("[data-date-filter]").forEach(button => {
        button.addEventListener("click", () => {
          state.deadlineFilter = button.dataset.dateFilter;
          render();
        });
      });
      document.querySelector("#searchInput").addEventListener("input", event => {
        state.search = event.target.value.trim().toLocaleLowerCase();
        document.querySelector("#clearSearch").hidden = !event.target.value;
        render();
      });
      document.querySelector("#clearSearch").addEventListener("click", () => {
        document.querySelector("#searchInput").value = "";
        state.search = "";
        document.querySelector("#clearSearch").hidden = true;
        render();
        document.querySelector("#searchInput").focus();
      });
      document.querySelector("#undoButton").addEventListener("click", undoLastAction);
      document.querySelector("#dismissUndo").addEventListener("click", () => {
        state.undoStack = [];
        renderUndo();
      });
      let displayedDay = isoToday();
      function refreshDay() {
        if (displayedDay === isoToday()) return;
        displayedDay = isoToday();
        render();
      }
      window.setInterval(refreshDay, 30000);
      window.addEventListener("focus", refreshDay);
      document.addEventListener("visibilitychange", refreshDay);

      state.settings = loadSettings();
      applySettings();
      state.tasks = loadTasks();
      render();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js").catch(() => {
            /* PWA installability should not block the task app. */
          });
        });
      }
    </script>
  </body>
</html>
